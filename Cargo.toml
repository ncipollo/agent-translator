[package]
name = "agent-translator"
description = "Translate between AI coding agent formats."
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/agent-translator"
version = "0.1.0"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "fs", "io-std"] }
toml = "1.2.1"
uuid = { version = "1.21.0", features = ["v4"] }

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["signal"] }
