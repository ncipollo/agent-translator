[package]
name = "agent-translator"
description = "Translate between AI coding agent formats."
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/agent-translator"
version = "0.1.0"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

[dev-dependencies]
tempfile = "3.27.0"
